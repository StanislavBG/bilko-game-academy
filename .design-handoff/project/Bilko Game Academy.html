<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bilko Game Academy — UI redesign</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    /* Warm parchment + deep sea + gold — kid-friendly, iPad-first */
    --bg: #f4ece0;          /* warm parchment */
    --bg-2: #ebe0cf;        /* deeper parchment */
    --ink: #1a2733;         /* deep sea ink */
    --ink-soft: #46586a;
    --ink-mute: #7a8a99;
    --line: #d9cdb8;
    --line-soft: #e6dcc8;
    --card: #ffffff;
    --card-2: #fbf6ec;

    --sea-50:  #e9f1f4;
    --sea-100: #d0e2e8;
    --sea-200: #9ec3cf;
    --sea-400: #4f8a9c;
    --sea-600: #2c5e6f;
    --sea-700: #1f4754;
    --sea-800: #143542;
    --sea-900: #0c2531;

    --gold-300: #f0c97a;
    --gold-400: #e0b063;
    --gold-500: #c79448;
    --gold-600: #a37835;
    --gold-700: #7e5b27;

    --crimson: #b54545;
    --leaf: #4f8a4a;

    /* Act tints */
    --act-1-warm: #e8b86b;   /* Sunlit Delta */
    --act-1-bg:   #f7e8c8;
    --act-2-cool: #6c8da6;   /* Cursed Fog */
    --act-2-bg:   #d8e3eb;
    --act-3-ember: #c5572f;  /* Volcanic Reach */
    --act-3-bg:   #efd0c0;

    --radius: 14px;
    --radius-lg: 22px;
    --shadow-card: 0 1px 0 rgba(28,38,49,.04), 0 8px 28px -12px rgba(28,38,49,.18);
    --shadow-pop:  0 1px 0 rgba(28,38,49,.04), 0 24px 60px -20px rgba(28,38,49,.30);
  }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  .display { font-family: 'Fraunces', 'Palatino', Georgia, serif; font-feature-settings: "ss01"; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .num  { font-variant-numeric: tabular-nums; }

  /* Subtle paper grain */
  .paper-grain {
    position: relative;
  }
  .paper-grain::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(120,90,40,.05) 1px, transparent 1.2px);
    background-size: 3px 3px;
    mix-blend-mode: multiply;
    opacity: .5;
  }

  /* App-frame (iPad portrait + landscape switch via container query) */
  .app {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 264px 1fr;
    grid-template-rows: 1fr;
    background: var(--bg);
  }
  @media (max-width: 880px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr 88px; }
  }

  /* Stripe placeholder for missing imagery */
  .stripe-placeholder {
    background:
      repeating-linear-gradient(135deg,
        rgba(28,38,49,.05) 0 8px,
        rgba(28,38,49,.02) 8px 16px);
    color: var(--ink-mute);
    display:flex; align-items:center; justify-content:center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid transparent;
    font: 600 14px/1 'Inter', sans-serif;
    cursor: pointer;
    min-height: 44px;
    transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    user-select: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #0d1924; }
  .btn-gold { background: var(--gold-500); color: var(--sea-900); }
  .btn-gold:hover { background: var(--gold-400); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: var(--card-2); border-color: var(--ink-mute); }
  .btn-disabled { background: var(--bg-2); color: var(--ink-mute); cursor: not-allowed; }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  /* Pill */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--card-2);
    border: 1px solid var(--line);
    font: 600 11px/1 'Inter';
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-soft);
  }

  /* Scrollbars */
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  /* Page transitions */
  .page-enter { animation: fadeUp .26s ease-out both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Confetti for purchases */
  @keyframes pop {
    0% { transform: scale(.96); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop .35s ease-out; }

  /* Toast */
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Compass (decorative SVG) */
  .compass-rotate { animation: spin 80s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Wave divider */
  .wave-line {
    height: 12px;
    background:
      radial-gradient(circle at 6px 10px, var(--line) 5px, transparent 5.5px) 0 0/12px 12px;
    opacity: .7;
  }

  /* Density modifier */
  .density-cozy   { --pad-card: 18px; --gap-grid: 14px; }
  .density-roomy  { --pad-card: 24px; --gap-grid: 20px; }
  .density-spacious { --pad-card: 32px; --gap-grid: 28px; }

  /* Tweaks panel z-index */
  .tweaks-panel-host { z-index: 100; }

  /* Hide scrollbars in horizontal stage strip */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>
